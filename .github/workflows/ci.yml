name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies (CI minimal)
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements-ci.txt
          pip install --no-cache-dir ruff black pytest pre-commit

      - name: Install dev tools
        run: |
          pip install ruff black pytest pre-commit

      - name: Ruff lint
        run: |
          ruff check .

      - name: Ruff format check
        run: |
          ruff format --check .

      - name: Pytest
        run: |
          pytest
