# Minimal config scaffold (will expand in later steps)

run:
  seed: 42
  output_dir: outputs
  run_name_prefix: run

data:
  raw_dir: data/raw
  images_dir: data/raw/images
  splits:
    train_csv: data/splits/train.csv
    val_csv: data/splits/val.csv
    test_csv: data/splits/test.csv
  image:
    mode: L
    size: 512
    normalize:
      type: "fixed"   # fixed | per_image
      mean: 0.0565
      std: 0.1362

dataloader:
  batch_size: 16
  num_workers: 2
  pin_memory: true

model:
  name: resnet18
  pretrained: true
  num_classes: 5

train:
  epochs: 1
  lr: 0.0003
